# software-start CI — shell/config hardening toolkit.
# Stages: lint (shellcheck) → test (bats) → secret-scan (gitleaks).
# No build/dependency-audit: this project has no package manager (yet).
# If Ansible is added later, add an `ansible-lint` job.

name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          # Find shell scripts by extension and by shebang; skip vendored bats.
          mapfile -t files < <(
            { grep -rIl --exclude-dir=.git --exclude-dir=tests/bats -E '^#!.*\b(bash|sh)\b' . || true
              find . -path ./.git -prune -o -name '*.sh' -print || true
            } | sort -u
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts to lint yet — skipping (not a failure)."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          shellcheck -x "${files[@]}"

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + agent runtime deps
        run: sudo apt-get update && sudo apt-get install -y bats jq iproute2
      - name: Run tests
        run: bats tests/

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend — install, type-check, build
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm run build
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Backend — cargo check
        working-directory: desktop/src-tauri
        run: cargo check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # full history so the scan covers past commits too
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
